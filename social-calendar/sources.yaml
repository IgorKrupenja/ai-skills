# Sources for the social-calendar crawl, synced from the bookmarks folder by sync_sources.ts
# on every crawl: new bookmarks are added, deleted ones are removed, `notes` are kept.
# Edit `notes` freely, but keep every value a double-quoted string on a single line.
sources:
  - name: "CULT Run Club"
    category: "Running"
    url: "https://www.instagram.com/cult.runclub?stkn=NTc4MTIwNjQ2YQ%3D%3D"
    notes: "Sundays 10:30, meet at Circle K Linnahalli (Põhja pst 33), finish at Rocket Bean Café. Register each run on Luma (free, no approval); on Sunday evening the next run's page isn't up yet and the bio still links the run just held. curl 'https://api.lu.ma/calendar/get-items?calendar_api_id=cal-uH5ZChifA5Mu9yK&period=future' (or period=past) lists the runs without a browser. No pinned posts or highlights."
  - name: "Eesti Sörgib – leia sörgiklubi enda lähedalt"
    category: "Running"
    url: "https://eestisorgib.ee/"
    notes: "Directory of ~80 sörk clubs, not events. Use the base44 API from run-clubs.md, keep clubs within the radius set there, and confirm each schedule on the club's Instagram. GAG Sörk (0.7 km, added 10.2026) is locked to Gustav Adolfi Gümnaasium students and alumni, so skip it. Kassisaba: the DB says Thu 18:30 and Sun 09:00, its Strava description says Tue 18:30 at the Falgi park fountain, and the club looks dormant (last club post on Strava 21.07.2026). Arteri's Strava confirms Wed 17:30. Hipodroomi runs weekly (the DB's biweekly is stale). We Run Volta registers each run on Luma calendar cal-OMNvOEozvIITmfc. Strava club pages need no login: curl the club URL and read __NEXT_DATA__ (club.description, latest club posts in preFetchedEntries); event details need login. Instagram's topsearch endpoint answered 404 on 2026-11-15, so guess handles by URL."
  - name: "Buns Run Club"
    category: "Running"
    url: "https://www.instagram.com/bunsrunclub/"
    notes: "TUE 18:30 Track @ Snelli (17.11.2026 was announced as the season's last track night), WED 18:30 5K @ Mikkeller (Old Town), SUN 11:00 10K @ Balta Karjane (@karjasesai). Since late October 2026 the bio names fixed starts: the Sunday rotation is over. 16.11 to 12.12.2026 the Wednesday runs are part of the Nike Winterized Running Challenge 2.0 (sign up in the Citysport app). No pinned posts."
  - name: "Long Run Tallinn"
    category: "Running"
    url: "https://www.instagram.com/longrun.tallinn/"
    notes: "Saturday long runs of 10+ km, usually 10:00, new route and start every week. Register on Luma calendar cal-FDuhbhRMwzljnBG; the next run appears there a few days ahead. Dormant since run #10 on 26.09.2026: still nothing new on Luma, IG or its Strava club 2220149 by 15.11."
  - name: "Pühaste Jooksuklubi"
    category: "Running"
    url: "https://www.instagram.com/puhaste_jooksuklubi/"
    notes: "Tuesdays 18:00 from Pühaste Taproom (Rotermanni 2). Both pinned posts are a partner's beer cruise, ignore them."
  - name: "Rotermann Run Club"
    category: "Running"
    url: "https://www.instagram.com/rotermannrunclub/"
    notes: "Tuesdays 17:30 in front of Golden Club Rotermanni (Rotermanni 5), 5 km at 6:45-7:00/km, free. The sörk DB wrongly says even weeks only. No posts between 22.09 and 13.10.2026, bio unchanged."
  - name: "Jooksupartner"
    category: "Running"
    url: "https://www.facebook.com/JOOKSUPARTNER/?ref=embed_page"
    notes: "Paid group trainings, no FB events. Back from the October 2026 break with a winter season since 01.11.2026: Wednesday strength training for runners at the A. Le Coq Arena gym (first-timers meet in the Eesti Jalgpalli Liit foyer), 19:00 from 18.11 (18:30 before), changing rooms open 30 min earlier for a warm-up jog; 5 € club members, 10 € others, first one free. The 01.11 season post replaced the Järve terviserada runs ('uus kuu, uus koht, uus sisu'). A weekly 'Uus nädal, uus trenn!' post (Saturday) sets the week. The feed loads out of order and shows an August post first: open the newest tiles in the page's Photos panel; innerText scrambles the post date, so read it from a screenshot."
  - name: "Viktoriinid ja quizid Tallinnas"
    category: "Quizzes"
    url: "https://www.facebook.com/Tallinnquizes/"
    notes: "Aggregator of Tallinn quizzes, not a venue. /upcoming_hosted_events lists the ones it co-hosts; for a recurring one, opening /events/<series>/ redirects to the next occurrence's URL and the other dates are links in the chips under the title (the 'and N more' text in the listing isn't clickable). The feed adds the spordipilet.ee series at OlyBet Bar & Grill, Harju 6, 18:00, which have no FB events: Kirgas Kriit (/turniirid/kirgas-kriit/, 10 € per person, usually Mondays but 24.11.2026 is a Tuesday; the page shows only the next game), Taibutaja (/turniirid/taibutaja/), Top Ear (/turniirid/topear/, while /top-ear/ redirects elsewhere) and Fiktoriin (/turniirid/fiktoriin/), the last three about monthly at 5 € with the season's dates on the page; a full game lists an 'Ootelist' (waitlist) under its 30 teams. A post's 'homme' is relative to the post's age. The feed also posts the dates of Eve Niemi's 'Kelle pea on prügikast?' quizzes at Alfred (Rahumäe tee 25, Mondays), Black Rose Pub in Viimsi (Tuesdays, 7 €) and Sardiinia Resto & Lounge (Masti 17, Wednesdays), all 19:00, one FB event per venue. The feed loads out of order and empties posts scrolled past, so read posts while scrolling down from a fresh load. Mõttemustrik (King Pong Events, O'Learys Kristiine, Tue 18:30) hasn't shown up here since early October 2026. Almost every quiz needs team pre-registration and fills up (30 teams)."
  - name: "Шейкер Квиз"
    category: "Quizzes"
    url: "https://tallinn.shakerquiz.ru/"
    notes: "Russian-language quiz franchise. curl is enough: the page HTML carries the whole schedule as data (name, number, time, price, status and venue per game; names in caps); in a browser the cards show only after scrolling to #games. Wed and Fri 19:00, some Sundays 15:00, at Kitchen Rõõm (P. Pinna 8, Lasnamäe), IMO Lounge (Lootsi 8) and Kochi Aidad (Lootsi 10). Teams of 1-10 (solo is fine), 10 € per person, registration on the page. Games have no URL of their own (the buttons open modals), so use the page URL with a #YYYY-MM-DD fragment. In that data event_time ends in Z but is local time, the date inside alias can be stale (trust event_time), and venues sit in a separate list keyed by game_id."
  - name: "Квиз Эйнштейн Пати"
    category: "Quizzes"
    url: "https://tallinn.albertparty.com/"
    notes: "Russian-language quiz, Thursdays 19:00 at Old Irish Mustakivi (Mahtra 1, Lasnamäe), 10 € per person. The schedule is in the page HTML (curl works), about a month ahead; registration on the page. Games have no URL of their own, so use /schedule#YYYY-MM-DD. Each game card's data-reg_type gives availability (avail, not_avail, reserve); the words 'МЕСТ НЕТ' are always in the HTML, hidden, so don't grep for them."
  - name: "FindQuiz Таллинн (Ruda Games)"
    category: "Quizzes"
    url: "https://tallinn.findquiz.ru/"
    notes: "Russian quiz aggregator. For Tallinn it lists only Ruda Games' Квизмашина games (all shown as Мозгобойня, venue sometimes wrong), each with its own page (/event/mozgoboinya-tallinn/<id>-<slug>; curl with a browser User-Agent). Every game here is also on the Ruda Games Таллинн bookmark, which has the full schedule: list each game once, from there."
  - name: "Hiiu Õlletuba: mälumänguliiga"
    category: "Quizzes"
    url: "https://hiiuolletuba.ee/malumang"
    notes: "Estonian quiz leagues at Hiiu Õlletuba (Pärnu mnt 370, Nõmme): Kolmapäevaliiga and Neljapäevaliiga, each every other week at 19:00. The page shows the next game of each (plain HTML). Team registration on the page, valid once the pub confirms. Tallinnquizes shares only the Wednesday league. The pub's full calendar is the separate 'Hiiu Õlletuba: üritused' bookmark."
  - name: "Eesti Mälumänguliit (kilb.ee)"
    category: "Quizzes"
    url: "https://www.kilb.ee/"
    notes: "Eesti Mälumänguliit, the competitive quiz scene. The homepage lists upcoming games (Eesolevad mängud), each with its own page (venue, time, registration); most are outside Tallinn (Jüri, Kuusalu, Räpina). The nearest is the Jüri series: second Wednesday of the month, 18:30, Jüri kultuurimaja (Aruküla tee 9), teams of up to 4, no advance registration, 10 € per team."
  - name: "Pudel Baar"
    category: "Quizzes"
    url: "https://www.instagram.com/pudelbaar/"
    notes: "Craft beer bar at Telliskivi 62. The bio lists Quiz Nights, but no quiz was announced in posts from July to mid-November 2026; kept in case quizzes return. Brewery events there (e.g. a beer release on 15.10.2026) show up as collab posts in the grid. Cask arrivals are posted without dates (five Tea Time Brewpub casks 'over the next few weeks', 25.10.2026) and are not events."
  - name: "Ruda Games Таллинн"
    category: "Quizzes"
    url: "https://rudagames.com/tallin/"
    notes: "Ruda Games' own Tallinn page with every game they run here: Туц Туц Quiz, ТУЦ Лото, Квизмашина and Мозгобойня, plus kids' games some Sundays 15:00. Tuesdays and Fridays 19:00 at Kitchen Rõõm (P. Pinna 8) and Kochi Aidad (Lootsi 10), 15 € per person, registration on the page about 4 weeks ahead. The page HTML has the game cards (curl works); the JSON API api.base.mozgo.com/events/dates/93?sort=played_at adds places taken, capacity and is_full. Candidate URL: the game's deep link rudagames.com/tallin/?modal=gameCardSeeMoreModal&uuid=<uuid from the API> (runs before 14.10.2026 used portal.mozgo.com/timetable#YYYY-MM-DD)."
  - name: "Hiiu Õlletuba: üritused"
    category: "Quizzes"
    url: "https://hiiuolletuba.ee/uritused"
    notes: "The pub's whole season calendar, as JSON inside the page (id, title, startsAt in UTC, ticketUrl, eventType event/live/holiday); the visible month grid shows only one event per day. Besides the league games (their own bookmark): Muusikabingo and Blitz games on Fridays or Saturdays around 21:00, live gigs with Piletilevi tickets, Open Mic. Skip eventType holiday and the 'Hiiu Õlletuba Reserveeritud!' entries (private bookings). No page per event: use hiiuolletuba.ee/uritused#YYYY-MM-DD."
  - name: "Biit.me"
    category: "Vinyl"
    url: "https://www.instagram.com/Biit.me"
    notes: "Record store at Vabriku 7, open Tue-Sat 12-19. Its first own event, the 15th birthday with guest DJs on 10.10.2026, is over and nothing new is announced yet. News comes in IG captions."
  - name: "Plaaditurg"
    category: "Vinyl"
    url: "https://www.facebook.com/Plaaditurg/"
    notes: "Record fairs and vinyl events, many of them in Tartu. Events at /upcoming_hosted_events (empty on 13.10.2026). Besides fairs they keep a regular stall at Nõmme turg, which is not an event."
  - name: "Terminal Records And Bar"
    category: "Vinyl"
    url: "https://baar.terminal.ee/en/"
    notes: "Record bar at Telliskivi 60/2, open Wed-Sun. The website's program block is often empty ('Ühtegi tulevast sündmust ei leitud' in October 2026): the full program is the separate Facebook events bookmark. Their Instagram (terminal_recordsandbar) posts a weekly 'Sel nädalal Terminalis' program on Wednesdays."
  - name: "Pamela Audiobar"
    category: "Vinyl"
    url: "https://www.instagram.com/pamela_audiobar/"
    notes: "Listening bar at Telliskivi 51a that also sells second-hand records. Open most Friday evenings from 19:00 (bio 'F 19-..'); a plain Friday opening is not an event. Occasional public events announced on IG (listening evenings, DJ nights, a summer weekender), with long gaps between them (latest: Sander Mölder & Erkin Antov, Fri 23.10.2026). The website pamela.bar has no program."
  - name: "Terminal Records&Bar: Facebook events"
    category: "Vinyl"
    url: "https://www.facebook.com/TerminalRecordsandBar/upcoming_hosted_events"
    notes: "The bar's full program: Terminal Jazz Jam on Wednesdays from 20:00-20:30 (free, Jason Hunter and friends), Terminal Arrivals DJ nights on Fridays 21:00, film quiz nights, Terminali Viktoriin, album listening evenings, literary evenings. The jam isn't every Wednesday any more (FB events on 21.10 and 4.11.2026, none on 11.11), so count only a jam with its own FB event or in the weekly program post 'Sel nädalal Terminalis! / This week at Terminal!' on the page's feed (text behind See more), which a weekend crawl won't have for the coming week yet. Some events pin their location to the Kalamaja school basketball court; the bar is at Telliskivi 60/2."
  - name: "SuperNova Kino TLU"
    category: "Film"
    url: "https://www.facebook.com/SupernovaKino/"
    notes: "Free semester screenings at TLU (Narva mnt 27, room N406), Tuesdays at 18:00 in autumn 2026 (from 06.10). Events at /upcoming_hosted_events, which on 15.11.2026 listed only the next screening (17.11). The page's Posts feed shows months-old posts (03.2026, 10.2025) first, so don't rely on it. The page goes quiet between semesters."
  - name: "VAATA OMETI! filmiklubi – Kino Sõprus"
    category: "Film"
    url: "https://kinosoprus.ee/program/vaata-ometi-filmiklubi/"
    notes: "Monthly Saturday screening with a discussion at Kino Sõprus; the page lists the next two sessions with film links. Price and free seats: soprus.kinola.ee/api/plugin/v1/events/<checkout-uuid>/et."
  - name: "Veinikino"
    category: "Film"
    url: "https://www.instagram.com/veinikino/?hl=en"
    notes: "Short films + wine at ETK, usually on a Thursday (doors 18:00, films 19:00). Sells out fast (first and last of the season within 24 h); tickets go on sale about 2 weeks ahead on Fienta (ETK organizer page o/etk-tallinn). Check without a browser through Fienta's public API: fienta.com/api/v1/public/events?organizer=1692 (ETK's numeric id) gives title, time, sale_status and URL. The API title is English ('Wine Cinema #57'); the original Estonian one is on fienta.com/et/<slug>. Its 'From 15 EUR' is a snack add-on: there are no single tickets, only Duopilet (34 € per person, bought in pairs), Triopilet (32 €, 3+) and a table for 7-9 (29 €), so read prices from the event page."
  - name: "Best Stand Up"
    category: "Stand-up"
    url: "https://www.instagram.com/beststandupeestis/"
    notes: "Russian-language stand-up, roughly monthly on Saturdays at 19:00 (doors 18:00), at RM Lounge (Parda 8) since September 2026 (IMO Lounge, Lootsi 8, in August). Tickets on Fienta (organizer o/10058); the bio names the next date once announced. The dated story highlights (7.11.2026, 17.10.2026, ...) are past shows. Fienta's public API lists the upcoming shows with time, venue, URL and 'From X EUR': fienta.com/api/v1/public/events?organizer=10058."
  - name: "Kokandus - Tallinna Rahvaülikool"
    category: "Cooking"
    url: "https://kultuur.ee/valdkond/kokandus/"
    notes: "Handled by kokandus.ts (SKILL.md step A3), not by reading the page: it covers every upcoming course, whatever the date, and reports NEW, SPOTS OPENED and ITALIAN. Courses the user already bought (the PAID calendar, read through bought.ts) come in its ALREADY BOUGHT block and never in the others. A course page names the instructor right before 'Koolituse juhendaja'. Courses are in Estonian unless the page says 'NB! Kursus on <keel> keeles' (only some Italian and Mexican ones are in English); 'Tallinn Connect B1+' courses are in Estonian but welcome learners."
  - name: "Matkajad | Facebook"
    category: "Hiking"
    url: "https://www.facebook.com/groups/1409233316018355"
    notes: "Large hiking group; events at /groups/1409233316018355/events. Expand the Upcoming section with its own 'See more' (the first one on the page; the last one expands Past events). Most hikes are outside Tallinn (Saaremaa, Läänemaa, Lahemaa), and commercial trips abroad are common."
  - name: "Uus Laine"
    category: "Venues"
    url: "https://uuslaine.com/home#kalender"
    notes: "The site calendar (uuslaine.com/kalenderi-full, curl works) shows only part of the program (5 items against 13 on Facebook in October 2026); the full program is the separate Facebook events bookmark. Each 'Info' link is an FB event with the time; tickets on Fienta or Piletitasku (check for SoldOut; Piletitasku blocks curl and headless browsers)."
  - name: "Erinevate Tubade Klubi"
    category: "Venues"
    url: "https://www.facebook.com/erinevatetubadeklubi/"
    notes: "Venue in Telliskivi; events at /upcoming_hosted_events. Hosts Veinikino. Their website has no program."
  - name: "What's On | Fotografiska Tallinn"
    category: "Venues"
    url: "https://tallinn.fotografiska.com/en/whats-on"
    notes: "Read this What's On page (the /en/events page lists nothing). Plain HTML: current exhibitions plus dated events, each event page with time, language and tickets. Recurring: free guided tours of the current exhibition (ENG Fri 19:00, FIN Sat 14:00, EST Sun 14:00, RUS first Sunday 15:00; exhibition ticket needed), Night Shift every Friday from 20:00 (10 €, open until midnight), House of Palagan cabaret about monthly (in Estonian). Also read the Estonian program page /et/naitused-ja-programm: it lists events the English page lacks (a workshop existed only at /et/events/<slug>). Tickets and RSVPs are on Fienta, whose public API (fienta.com/api/v1/public/events?search=...) gives the sale status."
  - name: "Facebook"
    category: "Venues"
    url: "https://www.facebook.com/trymorii/"
    notes: "Morii, a Japanese matcha and tea shop with a tea house at Kopli 16 (Põhja-Tallinn). The trymorii URL shows 'This content isn't available' as of 15.11.2026: the page is now facebook.com/morii.teas, so update the bookmark. Events at /morii.teas/upcoming_hosted_events (none on 15.11.2026). Past events: Japanese music afternoons ('Onkochishin', Sat 17.10.2026 14:00), Matcha & Paint workshops by Sip N' Wander (Sat 31.10.2026 10:00), a Halloween Matcha Party (31.10.2026 14:00, free). No cooking classes as of 15.11.2026."
  - name: "Uus Laine: Facebook events"
    category: "Venues"
    url: "https://www.facebook.com/uuslaine/upcoming_hosted_events"
    notes: "Uus Laine's full program: concerts, club nights, karaoke, salsa nights, the UNMUTE open stage and quizzes (Uus Laine's Legendary Quiz on Tuesdays 19:00, A Question of Music on some Mondays, SB Mälumäng). Recurring events need the occurrence URL: opening /events/<series>/ redirects to the next occurrence's URL, the nearest other dates are links in the chips under the title, and the '+N' chip opens a dialog with the rest. Tickets are mostly on Fienta: curl the event page and read its JSON-LD offers, one per ticket tier with InStock or SoldOut (early-bird tiers sell out first, so check the regular tier). The address shows as Kopli 4 or Vana-Kalamaja 1, the same place."
  - name: "Sündmused | Soome Instituut Eestis"
    category: "Aggregators"
    url: "https://finst.ee/sundmused/"
    notes: "Finnish Institute. The page shows the nearest days only: press 'Järgmised päevad' at the bottom; it no longer runs out (long exhibitions fill every day), and two clicks cover the two-week window. Keep the Tallinn events; many are in Tartu. curl gets only the first 7 days: the theme's AJAX endpoints (dayEvents.php, cateEvents.php) answer empty to curl, so later days need the browser. Listing links redirect to finst.ee/event/<slug>/. Recurring in Tallinn: Soome keele klubi monthly at Theatrumi kohvik AIT (Vene 14) at 17:00, any language level; Kirjandusklubi SIKK monthly at 17:30 in an Apollo bookshop (usually Apollo Plaza, Hobujaama 5; Kristiine Keskus in October 2026); Kaurismäki kolmapäevad at Kino Sõprus, a mid-month Wednesday."
  - name: "Говорит Зигмунд | Таллинн – Telegram"
    category: "Aggregators"
    url: "https://t.me/s/sigmundtells"
    notes: "Public Telegram channel in Russian about Tallinn events (~14.5K subscribers, a post a day): monthly digests (e.g. '31 событие октября', one event for each day, and the gastronomy of the month) plus single announcements. No browser needed: curl this URL to get the last ~17 posts with dates and full text (tgme_widget_message_text, time datetime); older posts via ?before=<post id>. Use the organizer or ticket link in the post as the candidate URL, else the post itself (t.me/sigmundtells/<id>). A weekly digest for the coming week (e.g. 12-18.10) appears on Monday morning (sometimes split in two posts), so a Sunday crawl has only the monthly digests; beyond it only the one-event-a-day monthly digest covers the window. Sold-out marks in posts go stale: check the ticket page. During PÖFF (November) there's a film-picks post; each film's poff.ee/ru/film/<slug>/ page lists its screenings in plain HTML (data-cal-start in UTC, data-cal-location, a 'Распродано' or 'Купить билет' button)."
