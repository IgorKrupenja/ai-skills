# Sources for the social-calendar crawl, synced from the bookmarks folder by sync_sources.py
# on every crawl: new bookmarks are added, deleted ones are removed, `notes` are kept.
# Edit `notes` freely, but keep every value a double-quoted string on a single line.
sources:
  - name: "CULT Run Club"
    category: "Running"
    url: "https://www.instagram.com/cult.runclub?stkn=NTc4MTIwNjQ2YQ%3D%3D"
    notes: "Sundays 10:30, meet at Circle K Linnahalli (Põhja pst 33), finish at Rocket Bean Café. Register each run on Luma: the bio link points to the next run, past runs are in Luma calendar cal-uH5ZChifA5Mu9yK. No pinned posts or highlights."
  - name: "Eesti Sörgib – leia sörgiklubi enda lähedalt"
    category: "Running"
    url: "https://eestisorgib.ee/"
    notes: "Directory of ~80 sörk clubs, not events. Use the base44 API from SKILL.md, keep clubs within the radius set there, and confirm each schedule on the club's Instagram. GAG Sörk (0.7 km, added 10.2026) is locked to Gustav Adolfi Gümnaasium students and alumni, so skip it. Kassisaba: the DB says Thu 18:30 and Sun 09:00, its Strava description says Tue 18:30. Arteri's Strava confirms Wed 17:30. We Run Volta registers each run on Luma calendar cal-OMNvOEozvIITmfc."
  - name: "Buns Run Club"
    category: "Running"
    url: "https://www.instagram.com/bunsrunclub/"
    notes: "TUE 18:30 Track @ Snelli, WED 18:30 5K @ Kalma plats, SUN 11:00 10K. The Sunday start rotates (Kalma plats, Cafe Tempo, Balta Karjane, Varav, Brick) and is announced a day or two ahead in a post and their broadcast channel. No pinned posts."
  - name: "Long Run Tallinn"
    category: "Running"
    url: "https://www.instagram.com/longrun.tallinn/"
    notes: "Saturday long runs of 10+ km, usually 10:00, new route and start every week. Register on Luma calendar cal-FDuhbhRMwzljnBG; the next run appears there a few days ahead. Quiet since run #10 on 26.09.2026: no new run on Luma or IG by 13.10."
  - name: "Pühaste Jooksuklubi"
    category: "Running"
    url: "https://www.instagram.com/puhaste_jooksuklubi/"
    notes: "Tuesdays 18:00 from Pühaste Taproom (Rotermanni 2). Both pinned posts are a partner's beer cruise, ignore them."
  - name: "Rotermann Run Club"
    category: "Running"
    url: "https://www.instagram.com/rotermannrunclub/"
    notes: "Tuesdays 17:30 in front of Golden Club Rotermanni (Rotermanni 5), 5 km at 6:45-7:00/km, free. The sörk DB wrongly says even weeks only. No posts between 22.09 and 13.10.2026, bio unchanged."
  - name: "Jooksupartner"
    category: "Running"
    url: "https://www.facebook.com/JOOKSUPARTNER/?ref=embed_page"
    notes: "Paid group trainings (7 € per session or 20 € a month, first one free), no FB events. On a break for all of October 2026 (the last trainings were the week of 28.09); expect a return in November. The weekly 'Uus nädal, uued trennid!' post sets the week: Wednesdays 18:15 at Järve terviserada (Merko parkla); the Monday training at Piiri tn 8a (Nõmme) was gone from the September posts. The feed loads out of order and can show a May post first: open the newest tiles in the page's Photos panel instead, their captions carry the date."
  - name: "Viktoriinid ja quizid Tallinnas"
    category: "Quizzes"
    url: "https://www.facebook.com/Tallinnquizes/"
    notes: "Aggregator of Tallinn quizzes, not a venue. /upcoming_hosted_events lists the ones it co-hosts (recurring events need the occurrence URL). The feed adds the spordipilet.ee series at OlyBet Bar & Grill, Harju 6 (Taibutaja, Top Ear, Kirgas Kriit, Fiktoriin): no FB events, dates on spordipilet.ee/turniirid/<slug>/; Fiktoriin is only in posts, and their 'homme' is relative to the post's age. Each spordipilet tournament page lists the season's dates (Kirgas Kriit on Mondays 18:00 at 10 € per person; Taibutaja, Top Ear and Fiktoriin about monthly at 5 €). Recurring FB events here (Uus Laine quiz Tue 19:00, Mõttemustrik at O'Learys Kristiine Tue 18:30): the '+N' chip on the event opens a dialog with every occurrence's id. Almost every quiz needs team pre-registration and fills up (30 teams)."
  - name: "Шейкер Квиз"
    category: "Quizzes"
    url: "https://tallinn.shakerquiz.ru/"
    notes: "Russian-language quiz franchise. curl is enough: the page HTML carries the whole schedule as data (name, number, time, price, status and venue per game; names in caps); in a browser the cards show only after scrolling to #games. Wed and Fri 19:00, some Sundays 15:00, at Kitchen Rõõm (P. Pinna 8, Lasnamäe), IMO Lounge (Lootsi 8) and Kochi Aidad (Lootsi 10). Teams of 1-10 (solo is fine), 10 € per person, registration on the page. Games have no URL of their own (the buttons open modals), so use the page URL with a #YYYY-MM-DD fragment."
  - name: "Квиз Эйнштейн Пати"
    category: "Quizzes"
    url: "https://tallinn.albertparty.com/"
    notes: "Russian-language quiz, Thursdays 19:00 at Old Irish Mustakivi (Mahtra 1, Lasnamäe), 10 € per person. The schedule is in the page HTML (curl works), about a month ahead; registration on the page. Games have no URL of their own, so use /schedule#YYYY-MM-DD. Each game card's data-reg_type gives availability (avail, not_avail, reserve); the words 'МЕСТ НЕТ' are always in the HTML, hidden, so don't grep for them."
  - name: "FindQuiz Таллинн (Ruda Games)"
    category: "Quizzes"
    url: "https://tallinn.findquiz.ru/"
    notes: "Russian quiz aggregator. For Tallinn it lists only Ruda Games' Квизмашина games (all shown as Мозгобойня, venue sometimes wrong), each with its own page (/event/mozgoboinya-tallinn/<id>-<slug>; curl with a browser User-Agent). Ruda Games' full Tallinn schedule is on portal.mozgo.com/timetable (city Таллин), also as JSON with places taken: api.base.mozgo.com/events/dates/93?sort=played_at. They play Tuesdays and Fridays 19:00 at Kitchen Rõõm (P. Pinna 8) and Kochi Aidad (Lootsi 10) as Туц Туц Quiz, ТУЦ Лото, Квизмашина and Мозгобойня, plus kids' games some Sundays 15:00; 15 € per person, registration on the portal about 4 weeks ahead. Portal games have no page of their own: use portal.mozgo.com/timetable#YYYY-MM-DD."
  - name: "Hiiu Õlletuba: mälumänguliiga"
    category: "Quizzes"
    url: "https://hiiuolletuba.ee/malumang"
    notes: "Estonian quiz leagues at Hiiu Õlletuba (Pärnu mnt 370, Nõmme): Kolmapäevaliiga and Neljapäevaliiga, each every other week at 19:00. The page shows the next game of each (plain HTML). Team registration on the page, valid once the pub confirms. Tallinnquizes shares only the Wednesday league. hiiuolletuba.ee/uritused carries the pub's whole season calendar as JSON in the page (league dates through January 2027, plus Friday Muusikabingo and Blitz games)."
  - name: "Eesti Mälumänguliit (kilb.ee)"
    category: "Quizzes"
    url: "https://www.kilb.ee/"
    notes: "Eesti Mälumänguliit, the competitive quiz scene. The homepage lists upcoming games (Eesolevad mängud), each with its own page (venue, time, registration); most are outside Tallinn (Jüri, Kuusalu, Räpina). The nearest is the Jüri series: second Wednesday of the month, 18:30, Jüri kultuurimaja (Aruküla tee 9), teams of up to 4, no advance registration, 10 € per team."
  - name: "Pudel Baar"
    category: "Quizzes"
    url: "https://www.instagram.com/pudelbaar/"
    notes: "Craft beer bar at Telliskivi 62. The bio lists Quiz Nights, but no quiz was announced in posts from July to mid-October 2026; kept in case quizzes return. Brewery events there (e.g. a beer release on 15.10.2026) show up as collab posts in the grid."
  - name: "Biit.me"
    category: "Vinyl"
    url: "https://www.instagram.com/Biit.me"
    notes: "Record store at Vabriku 7, open Tue-Sat 12-19. Its first own event, the 15th birthday with guest DJs on 10.10.2026, is over and nothing new is announced yet. News comes in IG captions."
  - name: "Plaaditurg"
    category: "Vinyl"
    url: "https://www.facebook.com/Plaaditurg/"
    notes: "Record fairs and vinyl events, many of them in Tartu. Events at /upcoming_hosted_events (empty on 13.10.2026). Besides fairs they keep a regular stall at Nõmme turg, which is not an event."
  - name: "Terminal Records And Bar"
    category: "Vinyl"
    url: "https://baar.terminal.ee/en/"
    notes: "Record bar at Telliskivi 60/2, open Wed-Sun. The website's program block is often empty ('Ühtegi tulevast sündmust ei leitud' in October 2026). The full program is on FB: facebook.com/TerminalRecordsandBar/upcoming_hosted_events (Terminal Jazz Jam every Wednesday 20:00, Terminal Arrivals DJ nights on Fridays 21:00, quizzes such as Terminali Viktoriin and film quiz nights, literary evenings). Their Instagram (terminal_recordsandbar) posts a weekly 'Sel nädalal Terminalis' program on Wednesdays."
  - name: "Pamela Audiobar"
    category: "Vinyl"
    url: "https://www.instagram.com/pamela_audiobar/"
    notes: "Listening bar at Telliskivi 51a that also sells second-hand records. Occasional public events announced on IG (listening evenings, DJ nights, a summer weekender), with long gaps between them."
  - name: "SuperNova Kino TLU"
    category: "Film"
    url: "https://www.facebook.com/SupernovaKino/"
    notes: "Free semester screenings at TLU (Narva mnt 27, room N406), Tuesdays at 18:00 in autumn 2026 (from 06.10). Events at /upcoming_hosted_events; the page goes quiet between semesters."
  - name: "VAATA OMETI! filmiklubi – Kino Sõprus"
    category: "Film"
    url: "https://kinosoprus.ee/program/vaata-ometi-filmiklubi/"
    notes: "Monthly Saturday screening with a discussion at Kino Sõprus; the page lists the next two sessions with film links. Price and free seats: soprus.kinola.ee/api/plugin/v1/events/<checkout-uuid>/et."
  - name: "Veinikino"
    category: "Film"
    url: "https://www.instagram.com/veinikino/?hl=en"
    notes: "Short films + wine at ETK, usually on a Thursday. Sells out fast (first and last of the season within 24 h); tickets go on sale about 2 weeks ahead on Fienta (ETK organizer page o/etk-tallinn). Check without a browser through Fienta's public API: fienta.com/api/v1/public/events?organizer=1692 (ETK's numeric id) gives title, time, sale_status and URL. #56, a costume party on 29.10.2026, was already on sale on 13.10."
  - name: "Erinevate Tubade Klubi"
    category: ""
    url: "https://www.facebook.com/erinevatetubadeklubi/"
    notes: "Venue in Telliskivi; events at /upcoming_hosted_events. Hosts Veinikino. Their website has no program."
  - name: "Best Stand Up"
    category: ""
    url: "https://www.instagram.com/beststandupeestis/"
    notes: "Russian-language stand-up, roughly monthly on Saturdays. Tickets on Fienta (organizer o/10058); the bio names the next date once announced. Fienta's public API lists the upcoming shows with time, venue, URL and 'From X EUR': fienta.com/api/v1/public/events?organizer=10058."
  - name: "Kokandus - Tallinna Rahvaülikool"
    category: ""
    url: "https://kultuur.ee/valdkond/kokandus/"
    notes: "Handled by kokandus.py (SKILL.md step A3), not by reading the page: it covers every upcoming course, whatever the date, and reports NEW, SPOTS OPENED and ITALIAN."
  - name: "Matkajad | Facebook"
    category: ""
    url: "https://www.facebook.com/groups/1409233316018355"
    notes: "Large hiking group; events at /groups/1409233316018355/events. Expand the Upcoming section with its own 'See more' (the first one on the page; the last one expands Past events). Most hikes are outside Tallinn (Saaremaa, Läänemaa, Lahemaa), and commercial trips abroad are common."
  - name: "Uus Laine"
    category: ""
    url: "https://uuslaine.com/home#kalender"
    notes: "The site calendar (uuslaine.com/kalenderi-full, curl works) shows only part of the program: in October 2026 it had 5 items where facebook.com/uuslaine/upcoming_hosted_events had 13 (concerts, club nights, karaoke, open stage, quizzes), so read the FB page too. Each 'Info' link is an FB event with the time; tickets on Fienta or Piletitasku (check for SoldOut; Piletitasku blocks curl and headless browsers). The weekly Tuesday quiz is an FB recurring event: per-date ids via the '+N' chip."
  - name: "What's On | Fotografiska Tallinn"
    category: ""
    url: "https://tallinn.fotografiska.com/en/whats-on"
    notes: "Read this What's On page (the /en/events page lists nothing). Plain HTML: current exhibitions plus dated events, each event page with time, language and tickets. Recurring: free guided tours of the current exhibition (ENG Fri 19:00, FIN Sat 14:00, EST Sun 14:00, RUS first Sunday 15:00; exhibition ticket needed), Night Shift every Friday from 20:00 (10 €, open until midnight), House of Palagan cabaret about monthly (in Estonian). Also read the Estonian program page /et/naitused-ja-programm: it lists events the English page lacks (a workshop existed only at /et/events/<slug>). Tickets and RSVPs are on Fienta, whose public API (fienta.com/api/v1/public/events?search=...) gives the sale status."
  - name: "Sündmused | Soome Instituut Eestis"
    category: ""
    url: "https://finst.ee/sundmused/"
    notes: "Finnish Institute. The page shows the nearest days only: press 'Järgmised päevad' at the bottom; it no longer runs out (long exhibitions fill every day), and two clicks cover the two-week window. Keep the Tallinn events; many are in Tartu. Listing links redirect to finst.ee/event/<slug>/. Recurring in Tallinn: Soome keele klubi monthly at Theatrumi kohvik AIT (Vene 14) at 17:00, any language level; Kirjandusklubi SIKK monthly at 17:30 in an Apollo bookshop (usually Apollo Plaza, Hobujaama 5; Kristiine Keskus in October 2026); Kaurismäki kolmapäevad at Kino Sõprus, a mid-month Wednesday."
  - name: "Говорит Зигмунд | Таллинн – Telegram"
    category: ""
    url: "https://t.me/s/sigmundtells"
    notes: "Public Telegram channel in Russian about Tallinn events (~14.5K subscribers, a post a day): monthly digests (e.g. '31 событие октября', one event for each day, and the gastronomy of the month) plus single announcements. No browser needed: curl this URL to get the last ~17 posts with dates and full text (tgme_widget_message_text, time datetime); older posts via ?before=<post id>. Use the organizer or ticket link in the post as the candidate URL, else the post itself (t.me/sigmundtells/<id>). A weekly digest for the coming week (e.g. 12-18.10) appears early in the week; beyond it only the one-event-a-day monthly digest covers the window. Sold-out marks in posts go stale: check the ticket page."
