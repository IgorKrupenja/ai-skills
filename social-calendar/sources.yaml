# Sources for the social-calendar crawl, synced from the bookmarks folder by sync_sources.py
# on every crawl: new bookmarks are added, deleted ones are removed, `notes` are kept.
# Edit `notes` freely, but keep every value a double-quoted string on a single line.
sources:
  - name: "CULT Run Club"
    category: "Running"
    url: "https://www.instagram.com/cult.runclub?stkn=NTc4MTIwNjQ2YQ%3D%3D"
    notes: "Sundays 10:30, meet at Circle K Linnahalli (Põhja pst 33), finish at Rocket Bean Café. Register each run on Luma: the bio link points to the next run, past runs are in Luma calendar cal-uH5ZChifA5Mu9yK. No pinned posts or highlights."
  - name: "Eesti Sörgib – leia sörgiklubi enda lähedalt"
    category: "Running"
    url: "https://eestisorgib.ee/"
    notes: "Directory of ~80 sörk clubs, not events. Use the base44 API from SKILL.md, keep clubs within the radius set there, and confirm each schedule on the club's Instagram."
  - name: "Buns Run Club"
    category: "Running"
    url: "https://www.instagram.com/bunsrunclub/"
    notes: "TUE 18:30 Track @ Snelli, WED 18:30 5K @ Kalma plats, SUN 11:00 10K. The Sunday start rotates (Kalma plats, Cafe Tempo, Balta Karjane, Varav, Brick) and is announced a day or two ahead in a post and their broadcast channel. No pinned posts."
  - name: "Long Run Tallinn"
    category: "Running"
    url: "https://www.instagram.com/longrun.tallinn/"
    notes: "Saturday long runs of 10+ km, usually 10:00, new route and start every week. Register on Luma calendar cal-FDuhbhRMwzljnBG; the next run appears there a few days ahead."
  - name: "Pühaste Jooksuklubi"
    category: "Running"
    url: "https://www.instagram.com/puhaste_jooksuklubi/"
    notes: "Tuesdays 18:00 from Pühaste Taproom (Rotermanni 2). Both pinned posts are a partner's beer cruise, ignore them."
  - name: "Rotermann Run Club"
    category: "Running"
    url: "https://www.instagram.com/rotermannrunclub/"
    notes: "Tuesdays 17:30 in front of Golden Club Rotermanni (Rotermanni 5), 5 km at 6:45-7:00/km, free. The sörk DB wrongly says even weeks only."
  - name: "Jooksupartner"
    category: "Running"
    url: "https://www.facebook.com/JOOKSUPARTNER/?ref=embed_page"
    notes: "Paid group trainings (7 € per session, first one free), no FB events. The weekly 'Uus nädal, uued trennid!' post sets the week: the Monday Tallinn training moved to Piiri tn 8a (Nõmme) and is sometimes cancelled; Wednesdays 18:15 at Järve terviserada. The feed loads out of order, so confirm the post date from a screenshot."
  - name: "Viktoriinid ja quizid Tallinnas"
    category: "Quizzes"
    url: "https://www.facebook.com/Tallinnquizes/"
    notes: "Aggregator of Tallinn quizzes, not a venue. /upcoming_hosted_events lists the ones it co-hosts (recurring events need the occurrence URL). The feed adds the spordipilet.ee series at OlyBet Bar & Grill, Harju 6 (Taibutaja, Top Ear, Kirgas Kriit, Fiktoriin): no FB events, dates on spordipilet.ee/turniirid/<slug>/; Fiktoriin is only in posts, and their 'homme' is relative to the post's age. Almost every quiz needs team pre-registration and fills up (30 teams)."
  - name: "Шейкер Квиз"
    category: "Quizzes"
    url: "https://tallinn.shakerquiz.ru/"
    notes: "Russian-language quiz franchise. The schedule renders with JS, so open the page in the browser: Wed and Fri 19:00, some Sundays 15:00, at Kitchen Rõõm (P. Pinna 8, Lasnamäe), IMO Lounge (Lootsi 8) and Kochi Aidad (Lootsi 10). Teams of 1-10 (solo is fine), 10 € per person, registration on the page. Games have no URL of their own (the buttons open modals), so use the page URL with a #YYYY-MM-DD fragment."
  - name: "Квиз Эйнштейн Пати"
    category: "Quizzes"
    url: "https://tallinn.albertparty.com/"
    notes: "Russian-language quiz, Thursdays 19:00 at Old Irish Mustakivi (Mahtra 1, Lasnamäe), 10 € per person. The schedule is in the page HTML (curl works), about a month ahead; registration on the page. Games have no URL of their own, so use /schedule#YYYY-MM-DD."
  - name: "FindQuiz Таллинн (Ruda Games)"
    category: "Quizzes"
    url: "https://tallinn.findquiz.ru/"
    notes: "Russian quiz aggregator. For Tallinn it lists only Tallinn Ruda Games (shown as Мозгобойня): Tuesdays 19:00 at Kochi Aidad (Lootsi 10), Kitchen Rõõm and Kai Resto (Mere pst 20c), 15 € per person. Plain HTML, curl with a browser User-Agent; each game links to its own page (/event/mozgoboinya-tallinn/<id>-<slug>). A game can be listed here but missing from their FB (29.09 at Kai Resto). Registration is with the organizer: facebook.com/mzgb.tln (their FB shows only the next game)."
  - name: "Hiiu Õlletuba: mälumänguliiga"
    category: "Quizzes"
    url: "https://hiiuolletuba.ee/malumang"
    notes: "Estonian quiz leagues at Hiiu Õlletuba (Pärnu mnt 370, Nõmme): Kolmapäevaliiga and Neljapäevaliiga, each every other week at 19:00. The page shows the next game of each (plain HTML). Team registration on the page, valid once the pub confirms. Tallinnquizes shares only the Wednesday league."
  - name: "Eesti Mälumänguliit (kilb.ee)"
    category: "Quizzes"
    url: "https://www.kilb.ee/"
    notes: "Eesti Mälumänguliit, the competitive quiz scene. The homepage lists upcoming games (Eesolevad mängud), each with its own page (venue, time, registration); most are outside Tallinn (Jüri, Kuusalu, Räpina)."
  - name: "Pudel Baar"
    category: "Quizzes"
    url: "https://www.instagram.com/pudelbaar/"
    notes: "Craft beer bar at Telliskivi 62. The bio lists Quiz Nights, but no quiz was announced in posts from July to September 2026; kept in case quizzes return."
  - name: "Biit.me"
    category: "Vinyl"
    url: "https://www.instagram.com/Biit.me"
    notes: "Record store at Vabriku 7, open Tue-Sat. Promised to start its own events; none so far."
  - name: "Plaaditurg"
    category: "Vinyl"
    url: "https://www.facebook.com/Plaaditurg/"
    notes: "Record fairs and vinyl events, many of them in Tartu. Events at /upcoming_hosted_events."
  - name: "Terminal Records And Bar"
    category: "Vinyl"
    url: "https://baar.terminal.ee/en/"
    notes: "The site lists only the next program item or two; open Wed-Sun. Their Instagram (terminal_recordsandbar) posts a weekly 'Sel nädalal Terminalis' program, including a Wednesday quiz."
  - name: "Pamela Audiobar"
    category: "Vinyl"
    url: "https://www.instagram.com/pamela_audiobar/"
    notes: "Listening bar at Telliskivi 51a; currently private digs only, no public events."
  - name: "SuperNova Kino TLU"
    category: "Film"
    url: "https://www.facebook.com/SupernovaKino/"
    notes: "Free semester screenings at TLU (Narva mnt 27). FB quiet since March 2026; expect events during the semester."
  - name: "VAATA OMETI! filmiklubi – Kino Sõprus"
    category: "Film"
    url: "https://kinosoprus.ee/program/vaata-ometi-filmiklubi/"
    notes: "Monthly Saturday screening with a discussion at Kino Sõprus; the page lists the next session with a film link."
  - name: "Veinikino"
    category: "Film"
    url: "https://www.instagram.com/veinikino/?hl=en"
    notes: "Short films + wine at ETK, usually on a Thursday. Sells out fast (first and last of the season within 24 h); tickets go on sale about 2 weeks ahead on Fienta (ETK organizer page o/etk-tallinn)."
  - name: "Erinevate Tubade Klubi"
    category: ""
    url: "https://www.facebook.com/erinevatetubadeklubi/"
    notes: "Venue in Telliskivi; events at /upcoming_hosted_events. Hosts Veinikino. Their website has no program."
  - name: "Best Stand Up"
    category: ""
    url: "https://www.instagram.com/beststandupeestis/"
    notes: "Russian-language stand-up, roughly monthly on Saturdays. Tickets on Fienta (organizer o/10058); the bio names the next date once announced."
  - name: "Kokandus - Tallinna Rahvaülikool"
    category: ""
    url: "https://kultuur.ee/valdkond/kokandus/"
    notes: "Handled by kokandus.py (SKILL.md step A3), not by reading the page: it covers every upcoming course, whatever the date, and reports NEW, SPOTS OPENED and ITALIAN."
  - name: "Matkajad | Facebook"
    category: ""
    url: "https://www.facebook.com/groups/1409233316018355"
    notes: "Large hiking group; events at /groups/1409233316018355/events (click See more). Most hikes are outside Tallinn, and commercial trips abroad are common."
  - name: "Uus Laine"
    category: ""
    url: "https://uuslaine.com/home#kalender"
    notes: "Full program at uuslaine.com/kalenderi-full. Each 'Info' link is an FB event with the time; tickets on Fienta or Piletitasku (check for SoldOut). The weekly Tuesday quiz is an FB recurring event."
  - name: "What's On | Fotografiska Tallinn"
    category: ""
    url: "https://tallinn.fotografiska.com/en/whats-on"
    notes: "Read this What's On page (the /en/events page lists nothing). Plain HTML: current exhibitions plus dated events, each event page with time, language and tickets. Recurring: free guided tours of the current exhibition (ENG Fri 19:00, FIN Sat 14:00, EST Sun 14:00, RUS first Sunday 15:00; exhibition ticket needed), Night Shift every Friday from 20:00 (10 €, open until midnight), House of Palagan cabaret about monthly (in Estonian)."
