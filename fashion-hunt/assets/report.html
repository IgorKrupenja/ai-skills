<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600&display=swap">
{{FONTS}}
<style>
/* The fashion-hunt report page, built by scripts/report.ts, which fills in the title and the data below.
   Layout: one column. Summary boxes, a sticky filter bar, then the listings table, which turns into cards on phones. */
:root {
  --bg: #f1f4f6; --surface: #ffffff; --fg: #15212c; --muted: #5a6774; --line: #d7dee4;
  --accent: #94643a; --accent-soft: #f2e8dc; --link: #1d4e86; --warn: #ad4a17; --warn-soft: #fae7db; --chip: #e5ebef;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --surface: #142029; --fg: #e5ebf0; --muted: #93a1ae; --line: #253441;
    --accent: #d6a571; --accent-soft: #2b2218; --link: #8fb9ea; --warn: #f39260; --warn-soft: #36221a; --chip: #1c2a36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --surface: #142029; --fg: #e5ebf0; --muted: #93a1ae; --line: #253441;
  --accent: #d6a571; --accent-soft: #2b2218; --link: #8fb9ea; --warn: #f39260; --warn-soft: #36221a; --chip: #1c2a36;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
/* What the script hides stays hidden, also where a rule below gives the element a display */
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 4.2vw, 34px); letter-spacing: -0.01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 8px 0 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 70ch; margin: 8px 0 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; min-width: 0; }
.fact .k { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.fact p { margin: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button, .chips button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tabs .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chips button { padding: 3px 10px; background: var(--chip); border-color: transparent; }
.chips button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; max-width: 100%; }
/* A menu with long options, such as the sort menu, narrows to fit a small phone */
.row label select { min-width: 0; }
select { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tablebox { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.price, td.new, td.diff { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
th.r { text-align: right; }
th .sorth { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th .sorth:hover { color: var(--fg); }
th .sorth:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th .arr { font-size: 11px; opacity: .35; }
th[aria-sort="ascending"] .arr, th[aria-sort="descending"] .arr { opacity: 1; color: var(--accent); }
/* The column headings stay in view under the filter bar, while the table fits without scrolling sideways */
.tablebox.fits { overflow: visible; }
.tablebox.fits th { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 0px)); z-index: 3; background: var(--surface); }
.tablebox.fits th:first-child { border-top-left-radius: 9px; }
.tablebox.fits th:last-child { border-top-right-radius: 9px; }
/* The sort menu stands in for the column headings, which phones don't show */
@media (min-width: 761px) { label[for="sort"] { display: none; } }
td.price { font-weight: 600; }
td.price .sub { font-weight: 400; }
/* Notes under a price wrap, so a long one doesn't stretch its column */
td.price .sub, td.new .sub { white-space: normal; max-width: 22ch; margin-left: auto; }
td.shop a { font-weight: 500; }
td.item { min-width: 200px; }
.iwrap { display: flex; gap: 10px; align-items: flex-start; }
.thumb { flex: none; display: block; width: 64px; height: 64px; border-radius: 8px; background: var(--chip); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
/* A larger copy of the photo on hover, fixed to the window so the table's scroll box can't cut it off */
.preview { position: fixed; z-index: 20; width: 205px; height: 205px; border-radius: 10px; overflow: hidden; pointer-events: none; background: var(--chip); box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
.preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* What a filter with a short label does, shown on hover, keyboard focus or a tap; fixed to the window like the preview */
.tip { position: fixed; z-index: 21; box-sizing: border-box; width: max-content; padding: 8px 11px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
#l-norisk, #l-norepeat { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.above { color: var(--warn); font-weight: 600; }
.nonEU { font-weight: 700; }
.sub { display: block; color: var(--muted); font-size: 12px; }
.risk { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 0 5px; font-size: 13px; }
/* Listings with the same photo, on a line of their own above the note */
.same { display: block; margin-block: 2px 4px; color: var(--fg); font-size: 13px; }
.chg { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 5px; font-size: 12px; font-weight: 500; }
.grp { display: inline-block; background: var(--chip); color: var(--muted); border-radius: 4px; padding: 0 5px; font-size: 12px; font-weight: 500; }
.note { color: var(--muted); font-size: 13px; min-width: 180px; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 600; }
details .hint { margin-top: 8px; }
.ulist { columns: 2 280px; column-gap: 24px; margin: 10px 0 0; padding-left: 18px; font-size: 14px; }
.ulist li { break-inside: avoid; margin-bottom: 4px; }
.notes { display: grid; gap: 6px; font-size: 14px; color: var(--muted); max-width: 80ch; }
.notes h2 { color: var(--fg); }
.notes p { margin: 0; }
.eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hero { margin-top: 14px; }
.variants { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.variant { font: inherit; color: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; align-content: start; min-width: 0; }
.variant:hover, .variant[aria-pressed="true"] { border-color: var(--accent); }
.variant[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent); }
.variant .vname { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; margin-bottom: 2px; }
.variant .sw { flex: none; width: 26px; height: 26px; border-radius: 6px; overflow: hidden; display: inline-flex; }
.variant .sw svg { width: 100%; height: 100%; display: block; }
.variant .vstat { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.variant .vstat b { color: var(--fg); font-weight: 600; }
@media (max-width: 760px) {
  .tablebox { overflow: visible; }
  table, tbody { display: block; background: none; border: 0; }
  thead { display: none; }
  tbody { display: grid; gap: 10px; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  td { display: block; padding: 0; border: 0; min-width: 0; }
  td.item { grid-column: 1; grid-row: 1; font-weight: 600; min-width: 0; }
  td.price { grid-column: 2; grid-row: 1; }
  td.shop, td.cond, td.size, td.new, td.diff, td.ships, td.note { grid-column: 1 / -1; text-align: left; font-size: 13px; white-space: normal; }
  td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); }
  td.new .sub { margin-left: 0; max-width: none; }
  .thumb { width: 72px; height: 72px; }
  td.new:empty, td.diff:empty, td.note:empty, td.cond:empty { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style id="theme">/*THEME*/</style>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow" hidden></p>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="hero" id="hero" hidden></div>
  </header>

  <section class="variants" id="variants" hidden></section>

  <section class="facts" id="facts"></section>

  <section class="bar" id="bar">
    <div class="tabs" id="tabs" role="group"></div>
    <p class="hint" id="hint"></p>
    <div class="row">
      <div class="chips" id="sizes" role="group"><span class="count" id="l-size"></span></div>
      <div class="chips" id="conds" role="group"><span class="count" id="l-cond"></span></div>
      <label for="shop" id="shopbox"><span id="l-shop"></span> <select id="shop"></select></label>
      <label for="norisk" id="riskbox"><input type="checkbox" id="norisk" aria-describedby="tip-norisk"> <span id="l-norisk"></span> <span class="risk">⚠</span></label>
      <label for="eu" id="eubox"><input type="checkbox" id="eu"> <span id="l-eu"></span></label>
      <label for="cheap" id="cheapbox"><input type="checkbox" id="cheap"> <span id="l-cheap"></span></label>
      <label for="norepeat" id="repeatbox"><input type="checkbox" id="norepeat" aria-describedby="tip-norepeat"> <span id="l-norepeat"></span></label>
      <label for="sort"><span id="l-sort"></span> <select id="sort"></select></label>
      <span class="count" id="count"></span>
    </div>
  </section>

  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <details id="uvbox" hidden>
    <summary id="uvtitle"></summary>
    <p class="hint" id="uvhint"></p>
    <ul class="ulist" id="uv"></ul>
  </details>

  <section class="notes" id="notes"></section>
</div>
<div class="tip" id="tip-norisk" role="tooltip" hidden></div>
<div class="tip" id="tip-norepeat" role="tooltip" hidden></div>

<script>
const R = /*REPORT*/;
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;
const TEXT = {
  en: {
    listed: n => `${n} listed`, from: "from", median: "median", euSellers: "EU sellers", variants: "Variants",
    allTab: "All", allHint: "Every listing at once; near matches are tagged with how they differ.",
    size: "Size:", cond: "Condition:", conds: "Condition", shop: "Shop", all: "all", noRisk: "hide", eu: "EU only", cheap: "hide at or above the new price", price: "Price", asc: "cheapest first", desc: "priciest first",
    shown: (n, m) => `showing ${n} of ${m}`, risk: "authenticity risk",
    noRepeat: "hide repeats", repeatTip: "Listings with the same photo are most likely one item listed more than once: this shows only the cheapest, and its notes link the others.",
    samePhoto: n => `Same photo as ${n === 1 ? "another listing" : `${n} other listings`} (likely the same item)`,
    riskTip: "Hides listings flagged as an authenticity risk. The reason for each shows next to ⚠ in its notes.", noSize: "not stated", noPrice: "price unknown",
    cols: ["Shop", "Item", "Condition", "Size", "Price", "New", "Difference", "Ships from", "Notes"],
    empty: "Nothing matches these filters. Clear the size or switch tabs.", unverified: "Not checked yet",
    filters: "Filters", tabs: "Group", sizes: "Size", summary: "Summary", notes: "Notes", locale: "en-IE",
    sortBy: "Sort", sortDirs: { money: ["cheapest first", "priciest first"], diff: ["furthest below new first", "furthest above new first"],
      cond: ["best first", "worst first"], text: ["A to Z", "Z to A"], size: ["smallest first", "largest first"] },
  },
  ru: {
    listed: n => `${n} ${plural(n, "объявление", "объявления", "объявлений")}`, from: "от", median: "медиана", euSellers: "из ЕС", variants: "Варианты",
    allTab: "Все", allHint: "Все объявления сразу; у близких вариантов отмечено, чем они не подходят.",
    size: "Размер:", cond: "Состояние:", conds: "Состояние", shop: "Магазин", all: "все", noRisk: "без", eu: "только из ЕС", cheap: "скрыть по цене нового и дороже", price: "Цена", asc: "сначала дешёвые", desc: "сначала дорогие",
    shown: (n, m) => `показано ${n} из ${m}`, risk: "риск подделки",
    noRepeat: "скрыть повторы", repeatTip: "Объявления с одинаковым фото, скорее всего, одна и та же вещь: остаётся самое дешёвое, а в его заметках ссылки на остальные.",
    samePhoto: n => `То же фото у ${n === 1 ? "ещё одного объявления" : `${n} ${plural(n, "другого объявления", "других объявлений", "других объявлений")}`} (вероятно, та же вещь)`,
    riskTip: "Скрывает объявления с риском подделки. Причина у каждого указана рядом с ⚠ в заметках.", noSize: "не указан", noPrice: "цена неизвестна",
    cols: ["Магазин", "Модель и цвет", "Состояние", "Размер", "Цена", "Новая у бренда", "Разница", "Откуда", "Заметки"],
    empty: "Под эти фильтры ничего нет. Снимите размер или переключите вкладку.", unverified: "Ещё не проверены",
    filters: "Фильтры", tabs: "Группа", sizes: "Размер", summary: "Главное", notes: "Примечания", locale: "ru-RU",
    sortBy: "Сортировка", sortDirs: { money: ["сначала дешёвые", "сначала дорогие"], diff: ["сначала дешевле нового", "сначала дороже нового"],
      cond: ["сначала лучшие", "сначала худшие"], text: ["от А до Я", "от Я до А"], size: ["сначала маленькие", "сначала большие"] },
  },
};
const T = TEXT[R.lang] || TEXT.en;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = new Intl.NumberFormat(T.locale, { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 2 });
const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;

document.documentElement.lang = R.lang || "en";
$("title").textContent = R.title;
$("lede").innerHTML = R.lede || "";
$("lede").hidden = !R.lede;
$("eyebrow").textContent = R.eyebrow || "";
$("eyebrow").hidden = !R.eyebrow;
$("hero").innerHTML = R.hero || "";
$("hero").hidden = !R.hero;
$("facts").innerHTML = R.facts.map(f => `<div class="fact"><span class="k">${esc(f.title)}</span><p>${f.html}</p></div>`).join("");
$("facts").hidden = !R.facts.length;
$("facts").setAttribute("aria-label", T.summary);
$("notes").innerHTML = R.notes.map(n => (n.title ? `<h2>${esc(n.title)}</h2>` : "") + `<p>${n.html}</p>`).join("");
$("notes").hidden = !R.notes.length;
$("notes").setAttribute("aria-label", T.notes);
$("bar").setAttribute("aria-label", T.filters);
$("tabs").setAttribute("aria-label", T.tabs);
$("sizes").setAttribute("aria-label", T.sizes);
$("conds").setAttribute("aria-label", T.conds);
for (const k of ["size", "cond", "shop"]) $("l-" + k).textContent = T[k];
$("l-sort").textContent = T.sortBy;
$("l-norisk").textContent = T.noRisk;
$("tip-norisk").textContent = T.riskTip;
$("l-norepeat").textContent = T.noRepeat;
$("tip-norepeat").textContent = T.repeatTip;
$("l-eu").textContent = T.eu;
$("l-cheap").textContent = T.cheap;
$("empty").textContent = T.empty;
const cols = [...T.cols];
if (R.newLabel) cols[5] = R.newLabel;

const shopCounts = new Map();
for (const r of R.rows) shopCounts.set(r.shop, (shopCounts.get(r.shop) || 0) + 1);
const shops = [...shopCounts.keys()].sort((a, b) => shopCounts.get(b) - shopCounts.get(a));
$("shop").innerHTML = `<option value="">${esc(T.all)}</option>` + shops.map(s => `<option>${esc(s)}</option>`).join("");
$("shopbox").hidden = shops.length < 2;
$("riskbox").hidden = !R.rows.some(r => r.risk);
$("eubox").hidden = !R.rows.some(r => r.nonEU);
// Listings priced at or above the brand's own new price: rarely worth buying second-hand
const notCheaper = r => r.newPrice !== null && r.price !== null && r.price >= r.newPrice;
$("cheapbox").hidden = !R.rows.some(notCheaper);
$("repeatbox").hidden = !R.rows.some(r => r.dup);
$("sizes").hidden = R.sizeOrder.length < 2;
$("conds").hidden = R.conditionOrder.length < 2;

// A card per variant: in the order page.variants gives, then the rest by count
const variantCount = new Map();
for (const r of R.rows) if (r.variant) variantCount.set(r.variant, (variantCount.get(r.variant) || 0) + 1);
const variantDefs = new Map(R.variants.map(v => [v.name, v]));
const variants = [
  ...R.variants.map(v => v.name).filter(name => variantCount.has(name)),
  ...[...variantCount.keys()].filter(name => !variantDefs.has(name)).sort((a, b) => variantCount.get(b) - variantCount.get(a)),
];
const median = xs => { const s = [...xs].sort((a, b) => a - b), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const whole = x => money.format(Math.round(x));
$("variants").setAttribute("aria-label", T.variants);
$("variants").hidden = !variants.length;
$("variants").innerHTML = variants.map(name => {
  const rows = R.rows.filter(r => r.variant === name);
  const prices = rows.map(r => r.price).filter(p => p !== null);
  const euPrices = rows.filter(r => !r.nonEU).map(r => r.price).filter(p => p !== null);
  const def = variantDefs.get(name) || {};
  const stats = [esc(T.listed(rows.length)) + (prices.length ? ` · ${esc(T.from)} <b>${whole(Math.min(...prices))}</b>` : "")];
  if (prices.length > 1) {
    stats.push(`${esc(T.median)} <b>${whole(median(prices))}</b>` +
      (euPrices.length && euPrices.length < prices.length ? `, ${esc(T.euSellers)} <b>${whole(median(euPrices))}</b>` : ""));
  }
  if (def.hint) stats.push(esc(def.hint));
  return `<button type="button" class="variant" data-v="${esc(name)}" aria-pressed="false">
    <span class="vname">${def.swatch ? `<span class="sw" aria-hidden="true">${def.swatch}</span>` : ""}${esc(name)}</span>
    ${stats.map(s => `<span class="vstat">${s}</span>`).join("")}
  </button>`;
}).join("");

// The groups as tabs, plus one with every listing when more than one group has any
const ALL = "_all";
const MATCH = R.groups[0].id;
const groupLabels = Object.fromEntries(R.groups.map(g => [g.id, g.label]));
const tabs = [...R.groups];
if (new Set(R.rows.map(r => r.group)).size > 1) tabs.push({ id: ALL, label: T.allTab, hint: T.allHint });

// The columns the table sorts by, each with the value it sorts on; a missing value always goes last
const COND_RANK = Object.fromEntries(["newTags", "new", "likeNew", "veryGood", "good", "fair", "used", "other"].map((k, i) => [k, i]));
const SORTS = {
  shop: { col: 0, kind: "text", value: r => r.shop || null },
  cond: { col: 2, kind: "cond", value: r => COND_RANK[r.cond] ?? null },
  size: { col: 3, kind: "size", value: r => { const i = Math.min(...r.sizes.map(z => R.sizeOrder.indexOf(z)).filter(i => i >= 0)); return Number.isFinite(i) ? i : null; } },
  price: { col: 4, kind: "money", value: r => r.price },
  new: { col: 5, kind: "money", value: r => r.newPrice },
  diff: { col: 6, kind: "diff", value: r => r.newPrice !== null && r.price !== null ? r.price - r.newPrice : null },
  ships: { col: 7, kind: "text", value: r => r.ships || null },
};
// Only columns with at least two different values are worth sorting by
const sortKeys = Object.keys(SORTS).filter(k => new Set(R.rows.map(SORTS[k].value).filter(v => v !== null)).size > 1);
if (!sortKeys.includes("price")) sortKeys.unshift("price");
$("sort").innerHTML = sortKeys.flatMap(k => ["asc", "desc"].map((d, i) =>
  `<option value="${k}-${d}">${esc(cols[SORTS[k].col])}: ${esc(T.sortDirs[SORTS[k].kind][i])}</option>`)).join("");

const state = { group: MATCH, variants: new Set(), sizes: new Set(), conds: new Set(), shop: "", norisk: false, eu: false, cheap: true, norepeat: true, sortKey: "price", sortDir: "asc" };
try {
  const saved = JSON.parse(localStorage.getItem("fashion-hunt-filters") || "null");
  if (saved) {
    if (tabs.some(g => g.id === saved.group)) state.group = saved.group;
    // Pages from before several variants could be picked saved one, as variant
    state.variants = new Set([...(saved.variants || []), saved.variant].filter(v => variants.includes(v)));
    state.sizes = new Set((saved.sizes || []).filter(z => R.sizeOrder.includes(z)));
    state.conds = new Set((saved.conds || []).filter(c => R.conditionOrder.includes(c)));
    if (shops.includes(saved.shop)) state.shop = saved.shop;
    state.norisk = !!saved.norisk; state.eu = !!saved.eu;
    if (typeof saved.cheap === "boolean") state.cheap = saved.cheap;
    if (typeof saved.norepeat === "boolean") state.norepeat = saved.norepeat;
    if (sortKeys.includes(saved.sortKey)) state.sortKey = saved.sortKey;
    // Pages before column sorting saved only the price order, as sort
    if (saved.sortDir === "desc" || (!saved.sortKey && saved.sort === "desc")) state.sortDir = "desc";
  }
} catch {}
function save() {
  try { localStorage.setItem("fashion-hunt-filters", JSON.stringify({ ...state, variants: [...state.variants], sizes: [...state.sizes], conds: [...state.conds] })); } catch {}
}

function passes(r, anyGroup) {
  if (!anyGroup && state.group !== ALL && r.group !== state.group) return false;
  if (state.variants.size && !state.variants.has(r.variant)) return false;
  if (state.sizes.size && !r.sizes.some(z => state.sizes.has(z))) return false;
  if (state.conds.size && !state.conds.has(r.cond)) return false;
  if (state.shop && r.shop !== state.shop) return false;
  if (state.norisk && r.risk) return false;
  if (state.eu && r.nonEU) return false;
  if (state.cheap && !$("cheapbox").hidden && notCheaper(r)) return false;
  return true;
}

// Of the listings that pass the filters and share a photo, only the cheapest, while repeats are hidden
function dedupe(rows) {
  if (!state.norepeat || $("repeatbox").hidden) return rows;
  const cheapest = new Map();
  for (const r of rows) {
    if (r.dup && (!cheapest.has(r.dup) || (r.price ?? Infinity) < (cheapest.get(r.dup).price ?? Infinity))) cheapest.set(r.dup, r);
  }
  return rows.filter(r => !r.dup || cheapest.get(r.dup) === r);
}

for (const z of R.sizeOrder) {
  const b = document.createElement("button");
  b.type = "button"; b.id = "size-" + z; b.textContent = z; b.dataset.z = z;
  $("sizes").appendChild(b);
}
for (const c of R.conditionOrder) {
  const b = document.createElement("button");
  b.type = "button"; b.id = "cond-" + c; b.textContent = R.conditionNames[c] || c; b.dataset.c = c;
  $("conds").appendChild(b);
}

function renderHead() {
  $("head").innerHTML = cols.map((c, i) => {
    const cls = [4, 5, 6].includes(i) ? ' class="r"' : "";
    const k = sortKeys.find(k => SORTS[k].col === i);
    if (!k) return `<th${cls}>${esc(c)}</th>`;
    const on = state.sortKey === k;
    const sort = on ? (state.sortDir === "asc" ? "ascending" : "descending") : "none";
    return `<th${cls} aria-sort="${sort}"><button type="button" class="sorth" data-k="${k}">${esc(c)}<span class="arr" aria-hidden="true">${on ? (state.sortDir === "asc" ? "↑" : "↓") : "↕"}</span></button></th>`;
  }).join("");
}

function compare(a, b) {
  const s = SORTS[state.sortKey] || SORTS.price, dir = state.sortDir === "asc" ? 1 : -1;
  const va = s.value(a), vb = s.value(b);
  if ((va === null) !== (vb === null)) return va === null ? 1 : -1;
  if (va !== null && va !== vb) return dir * (typeof va === "string" ? va.localeCompare(vb, T.locale) : va - vb);
  return (a.price === null) - (b.price === null) || (a.price ?? 0) - (b.price ?? 0);
}

function render() {
  renderHead();
  $("tabs").innerHTML = tabs.map(g => {
    const n = dedupe(R.rows.filter(r => (g.id === ALL || r.group === g.id) && passes(r, true))).length;
    return `<button type="button" id="tab-${esc(g.id)}" data-g="${esc(g.id)}" aria-pressed="${state.group === g.id}">${esc(g.label)}<span class="n">${n}</span></button>`;
  }).join("");
  const group = tabs.find(g => g.id === state.group);
  $("hint").textContent = group.hint || "";
  $("hint").hidden = !group.hint;
  $("variants").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", state.variants.has(b.dataset.v)));
  $("sizes").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", state.sizes.has(b.dataset.z)));
  $("conds").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", state.conds.has(b.dataset.c)));
  $("shop").value = state.shop; $("norisk").checked = state.norisk; $("eu").checked = state.eu; $("cheap").checked = state.cheap; $("norepeat").checked = state.norepeat; $("sort").value = `${state.sortKey}-${state.sortDir}`;

  const list = dedupe(R.rows.filter(r => passes(r, false))).sort(compare);
  $("count").textContent = T.shown(list.length, R.rows.filter(r => state.group === ALL || r.group === state.group).length);
  $("empty").hidden = list.length > 0;
  $("rows").innerHTML = list.map(r => {
    const diff = r.newPrice !== null && r.price !== null ? r.price - r.newPrice : null;
    const newCell = r.newPrice !== null
      ? (r.newUrl ? link(r.newUrl, money.format(r.newPrice)) : esc(money.format(r.newPrice))) + (r.newNote ? `<span class="sub">${esc(r.newNote)}</span>` : "")
      : (r.newNote ? `<span class="sub">${esc(r.newNote)}</span>` : "");
    const diffCell = diff === null ? "" : `<span${diff > 0 ? ' class="above"' : ""}>${diff < 0 ? "−" : "+"}${money.format(Math.abs(diff))}</span>`;
    // Other listings with the same photo, each linked by its price (and shop, when it's another one)
    const same = r.same?.length
      ? `<span class="same">${esc(T.samePhoto(r.same.length))}: ${r.same.map(s => link(s.url, `${s.shop === r.shop ? "" : `${s.shop} `}${s.price === null ? T.noPrice : money.format(s.price)}`)).join(", ")}</span>`
      : "";
    const notes = [r.risk ? `<span class="risk">⚠ ${esc(T.risk)}: ${esc(r.risk)}</span>` : "", same, esc(r.note)].filter(Boolean).join(" ");
    return `<tr>
      <td class="shop" data-l="${esc(cols[0])}">${link(r.url, r.shop)}</td>
      <td class="item"><div class="iwrap">${r.image ? `<a class="thumb" href="${esc(r.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(r.image)}" alt="" loading="lazy" decoding="async"></a>` : ""}<div>${esc(r.item)}${r.change ? ` <span class="chg">${esc(r.change)}</span>` : ""}${state.group === ALL && r.group !== MATCH ? ` <span class="grp">${esc(groupLabels[r.group])}</span>` : ""}</div></div></td>
      <td class="cond" data-l="${esc(cols[2])}"${r.shopCondition && r.shopCondition !== r.condition ? ` title="${esc(r.shopCondition)}"` : ""}>${esc(r.condition)}</td>
      <td class="size" data-l="${esc(cols[3])}">${esc(r.size || T.noSize)}</td>
      <td class="price">${r.price === null ? esc(T.noPrice) : money.format(r.price)}${r.priceNote ? `<span class="sub">${esc(r.priceNote)}</span>` : ""}</td>
      <td class="new" data-l="${esc(cols[5])}">${newCell}</td>
      <td class="diff" data-l="${esc(cols[6])}">${diffCell}</td>
      <td class="ships${r.nonEU ? " nonEU" : ""}" data-l="${esc(cols[7])}">${esc(r.ships)}</td>
      <td class="note">${notes}</td>
    </tr>`;
  }).join("");
  fitTable();
  save();
}

// Sticky headings need the table out of its sideways-scrolling box, so only take it out when it fits
const tablebox = document.querySelector(".tablebox");
function fitTable() {
  // The bar's height is often fractional: tuck the headings a pixel under it, or rows show through a hairline gap
  document.documentElement.style.setProperty("--bar-h", `${$("bar").getBoundingClientRect().height - 1}px`);
  tablebox.classList.add("fits");
  tablebox.classList.toggle("fits", tablebox.querySelector("table").offsetWidth <= tablebox.clientWidth + 1);
}
new ResizeObserver(fitTable).observe($("bar"));
addEventListener("resize", fitTable);

$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-g]"); if (b) { state.group = b.dataset.g; render(); } });
// A click on a card adds its variant to the ones shown, and a second click takes it off again
$("variants").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  state.variants.has(b.dataset.v) ? state.variants.delete(b.dataset.v) : state.variants.add(b.dataset.v);
  render();
});
$("sizes").addEventListener("click", e => {
  const b = e.target.closest("button[data-z]"); if (!b) return;
  state.sizes.has(b.dataset.z) ? state.sizes.delete(b.dataset.z) : state.sizes.add(b.dataset.z);
  render();
});
$("conds").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]"); if (!b) return;
  state.conds.has(b.dataset.c) ? state.conds.delete(b.dataset.c) : state.conds.add(b.dataset.c);
  render();
});
$("shop").addEventListener("change", e => { state.shop = e.target.value; render(); });
$("norisk").addEventListener("change", e => { state.norisk = e.target.checked; render(); });
$("eu").addEventListener("change", e => { state.eu = e.target.checked; render(); });
$("cheap").addEventListener("change", e => { state.cheap = e.target.checked; render(); });
$("norepeat").addEventListener("change", e => { state.norepeat = e.target.checked; render(); });
$("sort").addEventListener("change", e => { [state.sortKey, state.sortDir] = e.target.value.split("-"); render(); });
// A click on a column heading sorts by it, and a second click turns the order round
$("head").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  if (state.sortKey === b.dataset.k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
  else { state.sortKey = b.dataset.k; state.sortDir = "asc"; }
  render();
});

if (R.unverified && R.unverified.items.length) {
  $("uvbox").hidden = false;
  $("uvtitle").textContent = `${R.unverified.title || T.unverified}: ${R.unverified.items.length}`;
  $("uvhint").innerHTML = R.unverified.hint || "";
  $("uvhint").hidden = !R.unverified.hint;
  $("uv").innerHTML = R.unverified.items.map(u => `<li>${link(u.url, u.label || u.url)}</li>`).join("");
}

// The hover preview of a listing's photo, over the thumbnail, or above it when there's no room below
const preview = document.createElement("div");
preview.className = "preview";
preview.hidden = true;
preview.setAttribute("aria-hidden", "true");
preview.appendChild(document.createElement("img")).alt = "";
document.body.appendChild(preview);
const canHover = matchMedia("(hover: hover) and (min-width: 761px)");
$("rows").addEventListener("mouseover", e => {
  const thumb = e.target.closest(".thumb");
  if (!thumb || !canHover.matches) return;
  const img = thumb.querySelector("img"), box = thumb.getBoundingClientRect(), size = 205, gap = 8;
  preview.firstChild.src = img.currentSrc || img.src;
  preview.style.top = `${box.top + size + gap <= innerHeight ? box.top : Math.max(gap, box.bottom - size)}px`;
  preview.style.left = `${Math.max(gap, Math.min(box.left, innerWidth - size - gap))}px`;
  preview.hidden = false;
});
$("rows").addEventListener("mouseout", e => {
  if (e.target.closest(".thumb") && !e.relatedTarget?.closest(".thumb")) preview.hidden = true;
});
// Scrolling the page or the table moves the thumbnail away from the preview
addEventListener("scroll", () => { preview.hidden = true; }, { capture: true, passive: true });

// A filter with a short label gets a tooltip saying what it does: on hover, on keyboard focus and after a tap
function tooltip(box, input, tip) {
  let timer, tapped = false;
  function place() {
    // Below the filter, or above it when there's no room, and within the filter bar's width
    const a = box.getBoundingClientRect(), bar = $("bar").getBoundingClientRect(), gap = 8;
    tip.style.maxWidth = `${Math.min(300, bar.width)}px`;
    tip.style.top = `${a.bottom + gap + tip.offsetHeight <= innerHeight ? a.bottom + gap : Math.max(gap, a.top - gap - tip.offsetHeight)}px`;
    tip.style.left = `${Math.max(bar.left, Math.min(a.left, bar.right - tip.offsetWidth))}px`;
  }
  const show = () => { clearTimeout(timer); tip.hidden = false; place(); };
  const hide = () => { clearTimeout(timer); tip.hidden = true; };
  // A mouse shows it after a moment, and can move from the filter onto it without it closing
  for (const el of [box, tip]) {
    el.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse") return; clearTimeout(timer); if (tip.hidden) timer = setTimeout(show, 300); });
    el.addEventListener("pointerleave", e => { if (e.pointerType !== "mouse") return; clearTimeout(timer); timer = setTimeout(hide, 150); });
  }
  input.addEventListener("focus", e => { if (e.target.matches(":focus-visible")) show(); });
  input.addEventListener("blur", hide);
  box.addEventListener("pointerdown", e => { tapped = e.pointerType !== "mouse"; });
  // This runs after render(), so the tooltip goes where the redrawn bar has put the filter
  input.addEventListener("change", () => { if (tapped || !tip.hidden) show(); tapped = false; });
  // A tap or click anywhere but the filter closes it, the tooltip itself included, since on phones it covers the filters below
  addEventListener("pointerdown", e => { if (!tip.hidden && !box.contains(e.target)) hide(); });
  addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  for (const type of ["scroll", "resize"]) addEventListener(type, () => { if (!tip.hidden) place(); }, { capture: true, passive: true });
}
tooltip($("riskbox"), $("norisk"), $("tip-norisk"));
tooltip($("repeatbox"), $("norepeat"), $("tip-norepeat"));
render();
</script>
